# each service is a container
# Docker compose will create a network automatically, so we don't have to create one
# docker compose up to start the containers, add -d to run in detached mode
# docker compose down to stop and remove containers, networks, volumes, and images created by up
# docker compose stop to just stop the containers
# docker compose start to restart stopped containers
# docker compose logs to see logs
# docker compose logs -f to follow logs
# docker compose ps to see running containers
# docker compose exec app sh to get a shell in the app container
services:
  app:
    image: node:lts-alpine
    command: sh -c "yarn install && yarn run dev"
    ports:
      - "127.0.0.1:3000:3000"
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: secret
      MYSQL_DB: todos
  mysql:
    image: mysql:8.0
    volumes:
      - todo-mysql-data:/var/lib/mysql
    environment:
      TZ: America/New_York
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: todos
volumes:
  todo-mysql-data: {}